apiVersion: apps/v1
kind: Deployment
metadata:
  name: titletrust-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: titletrust-backend
  template:
    metadata:
      labels:
        app: titletrust-backend
    spec:
      containers:
        - name: backend
          image: titletrust-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: titletrust-backend-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
