apiVersion: apps/v1
kind: Deployment
metadata:
  name: titletrust-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: titletrust-worker
  template:
    metadata:
      labels:
        app: titletrust-worker
    spec:
      containers:
        - name: worker
          image: titletrust-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "backend.workers.run_worker"]
          env:
            - name: QUEUE_MODE
              value: redis
          envFrom:
            - secretRef:
                name: titletrust-backend-secrets
          readinessProbe:
            exec:
              command: ["python", "-m", "backend.workers.run_worker", "--healthcheck"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["python", "-m", "backend.workers.run_worker", "--healthcheck"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
