name: Security Validation & Compliance Gates

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

jobs:
  security-scanning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python setup
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit[toml] pip-audit trivy

      # SAST - Bandit (Python security)
      - name: Run Bandit SAST scan
        run: |
          bandit -r backend/ \
            -f json -o bandit-report.json \
            --severity-level medium \
            --exclude ./backend/tests
        continue-on-error: true

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: bandit-report.json
          category: bandit

      # Dependency audit
      - name: Audit Python dependencies
        run: |
          pip-audit --desc 2>&1 | tee pip-audit-report.txt
        continue-on-error: true

      # Secret scanning - Gitleaks
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          source: backend/
          config: .gitleaks.toml
          verbose: true
          redact: true
        continue-on-error: true

      # Upload audit reports
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.txt

  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  sbom-generation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies & SBOM tools
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install cyclonedx-bom syft

      # Generate SBOM using CycloneDX
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-python-lib
          python -m cyclonedx_python \
            -o xml \
            -of sbom-cyclonedx.xml \
            -a requirements.txt

      # Generate SBOM using Syft
      - name: Generate Syft SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json > sbom-syft.json
        continue-on-error: true

      # Upload SBOMs
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-cyclonedx.xml
            sbom-syft.json

  test-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      # Run security tests
      - name: Run security tests
        run: |
          pytest backend/tests/test_security.py -v \
            --cov=backend/security \
            --cov=backend/domain/session_models \
            --cov=backend/repositories/token_repository \
            --cov=backend/services/session_security_service \
            --cov=backend/services/audit_export_service \
            --cov-report=term-missing \
            --cov-report=xml

      # Upload coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: security
          name: security-coverage

  # Container scanning (if using Docker)
  container-scan:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f backend/Dockerfile -t titletrust:security-scan .

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: 'titletrust:security-scan'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload container scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: trivy-container-results.sarif
          category: trivy-container

  # Security gate enforcement
  security-gates:
    runs-on: ubuntu-latest
    needs: [security-scanning, test-security]
    if: always()
    permissions:
      checks: write

    steps:
      - name: Verify security gates
        run: |
          echo "✓ SAST checks completed"
          echo "✓ Dependency audits completed"
          echo "✓ Secret scanning completed"
          echo "✓ Security tests passed"
          echo "✓ SBOM generated"
          
          # Exit with error if any upstream job failed
          if [ "${{ needs.security-scanning.result }}" == "failure" ]; then
            echo "❌ Security scanning failed"
            exit 1
          fi
          
          if [ "${{ needs.test-security.result }}" == "failure" ]; then
            echo "❌ Security tests failed"
            exit 1
          fi
          
          echo "✅ All security gates passed"

  # Final status check
  security-status:
    runs-on: ubuntu-latest
    needs: [security-gates, sbom-generation]
    if: always()
    permissions:
      checks: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - name: Create success check
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security Validation',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'success',
              output: {
                title: 'Security validation passed',
                summary: 'All security gates, tests, and compliance checks passed',
              }
            })

      - name: Create failure check
        if: ${{ failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Security Validation',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'failure',
              output: {
                title: 'Security validation failed',
                summary: 'One or more security checks failed. See workflow logs for details.',
              }
            })
