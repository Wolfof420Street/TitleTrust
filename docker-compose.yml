version: '3.8'

services:
  # Development container
  titletrust-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: titletrust-dev
    working_dir: /workspaces/TitleTrust
    volumes:
      - .:/workspaces/TitleTrust
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    depends_on:
      - redis
    networks:
      - titletrust-network

  # Redis for distributed queue
  redis:
    image: redis:7-alpine
    container_name: titletrust-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - titletrust-network

  # PostgreSQL for future persistence (optional)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: titletrust-postgres
  #   environment:
  #     POSTGRES_USER: titletrust
  #     POSTGRES_PASSWORD: titletrust_dev_password
  #     POSTGRES_DB: titletrust
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U titletrust"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  # Jaeger for distributed tracing (optional)
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   container_name: titletrust-jaeger
  #   environment:
  #     COLLECTOR_OTLP_ENABLED: "true"
  #   ports:
  #     - "6831:6831/udp"  # Jaeger agent
  #     - "16686:16686"    # Jaeger UI
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:16686"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Prometheus for metrics (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: titletrust-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"

volumes:
  redis_data:
  # postgres_data:
  # prometheus_data:

networks:
  default:
    name: titletrust-network
