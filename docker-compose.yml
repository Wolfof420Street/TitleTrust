services:
  # Development container
  titletrust-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: titletrust-dev
    working_dir: /workspaces/TitleTrust
    volumes:
      - .:/workspaces/TitleTrust
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8080"
    depends_on:
      - redis
    networks:
      - titletrust-network

  titletrust-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: titletrust-backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_MODE=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - LOG_LEVEL=INFO
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - jaeger
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titletrust-network

  titletrust-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: titletrust-worker
    command: ["python", "-m", "backend.workers.run_worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_MODE=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - LOG_LEVEL=INFO
    depends_on:
      - redis
      - jaeger
    healthcheck:
      test: ["CMD", "python", "-m", "backend.workers.run_worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titletrust-network

  # Redis for distributed queue
  redis:
    image: redis:7-alpine
    container_name: titletrust-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - titletrust-network

  # PostgreSQL for future persistence (optional)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: titletrust-postgres
  #   environment:
  #     POSTGRES_USER: titletrust
  #     POSTGRES_PASSWORD: titletrust_dev_password
  #     POSTGRES_DB: titletrust
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U titletrust"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:1.58.1
    container_name: titletrust-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - titletrust-network

  # Prometheus for metrics (optional)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: titletrust-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"

volumes:
  redis_data:
  # postgres_data:
  # prometheus_data:

networks:
  titletrust-network:
    name: titletrust-network
