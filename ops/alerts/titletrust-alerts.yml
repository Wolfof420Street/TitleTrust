groups:
  - name: titletrust-security
    interval: 1m
    rules:
      - alert: TitleTrustHighAbuseBlockRate
        expr: sum(rate(titletrust_abuse_blocks_total[5m])) > 5
        for: 5m
        labels:
          severity: warning
          service: titletrust-api
        annotations:
          summary: High adaptive abuse block rate
          description: Adaptive protection is blocking more than 5 requests/sec for 5 minutes.

      - alert: TitleTrustAbuseScoreP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(titletrust_abuse_score_bucket[5m]))) > 60
        for: 10m
        labels:
          severity: warning
          service: titletrust-api
        annotations:
          summary: Elevated abuse score distribution
          description: P95 adaptive abuse score has exceeded 60 for 10 minutes.

      - alert: TitleTrustHTTPLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(titletrust_http_request_latency_ms_bucket[5m]))) > 500
        for: 10m
        labels:
          severity: warning
          service: titletrust-api
        annotations:
          summary: HTTP latency above threshold
          description: P95 request latency has exceeded 500ms for 10 minutes.
