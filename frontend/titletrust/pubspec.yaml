name: titletrust
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Networking
  dio: ^5.4.0
  
  # Data Classes
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Hardware & Maps
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  permission_handler: ^11.1.0
  shared_preferences: ^2.5.4
  flutter_dotenv: ^6.0.0
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.1
  firebase_core: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.8
  custom_lint: ^0.6.4
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - .env
