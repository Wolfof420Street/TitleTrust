[pytest]
# Pytest configuration for TitleTrust

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mark registration to avoid warnings
markers =
    security: Tests for security components (token rotation, anomaly detection, etc.)
    enterprise: Tests for enterprise features
    slow: Slow tests (longer than 5 seconds)
    integration: Integration tests requiring external services
    unit: Unit tests
    e2e: End-to-end tests
    benchmark: Performance benchmark tests
    flaky: Tests that may be flaky

# Asyncio configuration
asyncio_mode = strict

# Coverage configuration
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Test timeouts
timeout = 300

# Log configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning
